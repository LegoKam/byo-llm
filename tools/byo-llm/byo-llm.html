<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>BYO LLM</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!--
      Scripts and styles load from this plugin's own origin only. connect-src stays open to
      https (and to http on localhost, for a model on the author's machine) because the LLM
      endpoint is whatever the site admin configured.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; base-uri 'none'; form-action 'none'">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./byo-llm.css">
    <script src="./byo-llm.js" type="module"></script>
  </head>
  <body>
    <div id="app"><p class="loading">Connecting to Experience Workspace…</p></div>
  </body>
</html>
